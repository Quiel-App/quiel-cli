name: Something is broken
description: The client does not do what the README says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please paste the output of `quiel --version` and `quiel status` below.

        `quiel status` does **not** print your token. It does print your
        platform address, project key and agent id — redact them if that
        matters to you.
  - type: dropdown
    id: agent
    attributes:
      label: Which agent
      options: [Claude Code, Codex, Cursor, OpenCode, Other]
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: quiel --version and quiel status
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
